[workspace]
resolver = "2"
members = [
    "crates/tv-pilot-core",
    "crates/tv-pilot-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["TV Pilot Contributors"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
urlencoding = "2.1"
tv-pilot-core = { path = "crates/tv-pilot-core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
